name: Installers

# Builds the Windows, macOS and Linux installers (packaging/README.md), then
# installs each on a fresh machine and runs the app's self-check there, so a
# library left out fails here instead of on someone's computer. A version tag
# (v0.1.0, matching pyproject.toml) also drafts a GitHub release with them.
on:
  push:
    tags: ["v*"]
    branches: [main]
    # What can change what gets bundled.
    paths:
      - "packaging/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/installers.yml"
  pull_request:
    paths:
      - "packaging/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/installers.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: "Build (${{ matrix.name }})"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # The oldest macOS the Mac downloads run on: PySide6 6.11's own libraries
      # need macOS 15, whatever its wheels' names say. Checked after the build.
      MINIMUM_MACOS: "15.0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          # Apple Silicon. OpenCV has no build for both kinds of Mac, so Intel
          # Macs get a disk image of their own, built on an Intel Mac.
          - { name: macOS, os: macos-latest }
          - { name: macOS-Intel, os: macos-15-intel }
          # The oldest supported Ubuntu, so the AppImage runs on older systems too.
          - { name: Linux, os: ubuntu-22.04 }

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Sets VERSION for the later steps, which read it from the environment
      # rather than having it pasted into their scripts.
      - name: Work out the version
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          # It goes into file names and the installers: digits, dots and
          # letters only.
          if ! [[ "$version" =~ ^[0-9]+(\.[0-9]+)*([a-z0-9.]*)$ ]]; then
            echo "::error::pyproject.toml's version \"$version\" isn't like 1.2.3"
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::Tag $GITHUB_REF_NAME doesn't match pyproject.toml's version $version"
              exit 1
            fi
          else
            version="$version-dev.${GITHUB_SHA::7}"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # Bundled into the AppImage: Qt's X11 plugin needs it, and desktops
      # without it would otherwise fail to open a window.
      - name: Install libraries to bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-cursor0

      - name: Install uv and Python
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          # Release builds start clean, so nothing cached by another run goes in.
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          python-version: "3.13"

      - name: Install the app and PyInstaller
        run: uv sync --frozen --no-dev --group packaging

      - name: Build the app
        run: uv run --no-sync pyinstaller --noconfirm packaging/omr-data-collector.spec

      - name: Build the installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Inno Setup 6.7.3, pinned and checked.
          $setup = "$env:RUNNER_TEMP\innosetup.exe"
          Invoke-WebRequest -Uri https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile $setup
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash
          if ($hash -ne "9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732") {
            throw "Inno Setup download doesn't match its checksum: $hash"
          }
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=$env:RUNNER_TEMP\inno" -Wait
          & "$env:RUNNER_TEMP\inno\ISCC.exe" "/DAppVersion=$env:VERSION" packaging\windows\omr-data-collector.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build the disk image (macOS)
        if: runner.os == 'macOS'
        run: packaging/macos/build_dmg.sh "$VERSION"

      - name: Check the oldest macOS it runs on (macOS)
        if: runner.os == 'macOS'
        run: |
          packaging/macos/check_minimum_macos.sh "dist/OMR Data Collector.app" \
            "$MINIMUM_MACOS"

      - name: Build the AppImage (Linux)
        if: runner.os == 'Linux'
        run: packaging/linux/build_appimage.sh "$VERSION"

      - name: Keep the installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: installer-${{ matrix.name }}
          path: |
            dist/*-Setup.exe
            dist/*.dmg
            dist/*.AppImage
          if-no-files-found: error

  check:
    name: "Install and check (${{ matrix.name }})"
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
          - { name: macOS-Intel, os: macos-15-intel }
          # A newer Ubuntu than the build's, with no Python or project files.
          - { name: Linux, os: ubuntu-24.04 }

    steps:
      - name: Fetch the installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: installer-${{ matrix.name }}

      - name: Install and run the self-check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = (Get-ChildItem *-Setup.exe).FullName
          $app = "$env:RUNNER_TEMP\omr"
          Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/DIR=$app" -Wait
          $run = Start-Process "$app\omr-data-collector.exe" -ArgumentList "--self-check", "$env:RUNNER_TEMP\report.txt" -Wait -PassThru
          Get-Content "$env:RUNNER_TEMP\report.txt"
          exit $run.ExitCode

      - name: Install and run the self-check (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil attach *.dmg -nobrowse -mountpoint "$RUNNER_TEMP/dmg"
          cp -R "$RUNNER_TEMP/dmg/OMR Data Collector.app" "$RUNNER_TEMP/"
          hdiutil detach "$RUNNER_TEMP/dmg"
          status=0
          "$RUNNER_TEMP/OMR Data Collector.app/Contents/MacOS/omr-data-collector" \
            --self-check "$RUNNER_TEMP/report.txt" || status=$?
          cat "$RUNNER_TEMP/report.txt"
          exit $status

      # What a desktop has and a bare runner doesn't; there's no display, so
      # Qt draws offscreen.
      - name: Install and run the self-check (Linux)
        if: runner.os == 'Linux'
        env:
          QT_QPA_PLATFORM: offscreen
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          chmod +x ./*.AppImage
          status=0
          ./*.AppImage --self-check "$RUNNER_TEMP/report.txt" || status=$?
          cat "$RUNNER_TEMP/report.txt"
          exit $status

      # The self-check runs offscreen, so X11's keyboard code never loads. This
      # opens the app on a virtual display and types into it: libxkbcommon and
      # libxkbcommon-x11 must come from the same place, or the first key pressed
      # can crash the app.
      - name: Type into the app under X11 (Linux)
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          DISPLAY: ":99"
        run: |
          sudo apt-get install -y xvfb xdotool libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xkb1
          Xvfb "$DISPLAY" -screen 0 1280x800x24 &
          for _ in $(seq 30); do
            xdotool getmouselocation >/dev/null 2>&1 && break
            sleep 1
          done
          # The app's data goes in a folder of its own, not the runner's.
          export XDG_DATA_HOME="$RUNNER_TEMP/typing/data"
          export XDG_CONFIG_HOME="$RUNNER_TEMP/typing/config"
          log="$RUNNER_TEMP/typing.log"
          ./*.AppImage >"$log" 2>&1 &
          if ! window=$(timeout 120 xdotool search --sync --onlyvisible --name "OMR Data Collector" | head -n 1); then
            cat "$log"
            echo "::error::The app's window didn't open"
            exit 1
          fi
          pid=$(xdotool getwindowpid "$window")
          sleep 3
          # With no window manager, keys go to the window under the pointer.
          xdotool mousemove --window "$window" 100 100
          xdotool type --delay 100 "Typing test"
          sleep 5
          if ! kill -0 "$pid" 2>/dev/null; then
            cat "$log"
            echo "::error::The app quit when typed into"
            exit 1
          fi
          core=$(grep -m 1 -o '/[^ ]*/libxkbcommon\.so[^ ]*' "/proc/$pid/maps" || true)
          x11=$(grep -m 1 -o '/[^ ]*/libxkbcommon-x11\.so[^ ]*' "/proc/$pid/maps" || true)
          echo "libxkbcommon: ${core:-not loaded}"
          echo "libxkbcommon-x11: ${x11:-not loaded}"
          if [ -z "$core" ] || [ -z "$x11" ] || [ "$(dirname "$core")" != "$(dirname "$x11")" ]; then
            echo "::error::libxkbcommon and libxkbcommon-x11 don't come from the same place"
            exit 1
          fi
          kill "$pid"

  release:
    name: Draft the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch the installers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: installer-*
          merge-multiple: true

      - name: Draft a release with them
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --draft --generate-notes --title "OMR Data Collector ${GITHUB_REF_NAME#v}" \
            ./*-Setup.exe ./*.dmg ./*.AppImage
