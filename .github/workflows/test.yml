name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-coverage:
    name: "Test and Coverage (${{ matrix.os }}, Python ${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    # A test stuck on a dialog would otherwise hold the runner for six hours.
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # The app ships on all three desktops; min and max supported Python on Linux.
        include:
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.13" }
          - { os: macos-latest, python-version: "3.13" }
          - { os: windows-latest, python-version: "3.13" }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The libraries Qt's offscreen platform plugin loads on a bare Ubuntu runner.
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: Setup Python ${{ matrix.python-version }} with uv
        uses: ./.github/actions/setup-python-with-uv
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests with coverage gate
        run: ./scripts/run_all_tests_and_coverage.sh
        shell: bash
        env:
          OMR_CHECKER_CONTAINER: true
