# Adapted from OMRChecker v2's .pre-commit-config.yaml. Its local convert/resize
# image hooks are left out: they run scripts that only exist in OMRChecker's repo,
# for its sample images.
exclude: "^vendor/|(__snapshots__|__image_snapshots__)/.*$"
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.12.23
    hooks:
      - id: uv-lock
        fail_fast: true
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.8 # Note: this version should match with that of ruff in pyproject.toml to avoid unknown rules
    hooks:
      - id: ruff
        name: Ruff check
        description: "Run 'ruff check' for extremely fast Python linting"
        args: [--fix]
        fail_fast: true

      - id: ruff-format
        name: Ruff format
        description: "Run 'ruff format' for extremely fast Python formatting"
        fail_fast: true

  # Run image compressor before the large files check
  - repo: https://github.com/boidolr/pre-commit-images
    rev: v1.9.0
    hooks:
      - id: optimize-png
      - id: optimize-jpg
        args: ["--quality", "90"]
        fail_fast: true # Wait for user to commit the files

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
        stages: [pre-commit]
        fail_fast: false
      - id: check-added-large-files
        args: ["--maxkb=300"]
        exclude: ^.*\.(lock)$
        fail_fast: false
        stages: [pre-commit]
      - id: pretty-format-json
        args: ["--autofix", "--no-sort-keys"]
        fail_fast: true

  - repo: local
    hooks:
      - id: pyright
        name: Pyright
        entry: uv run pyright
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: pytest-on-commit
        name: Running single sample test
        entry: ./scripts/run_single_test.sh
        language: script
        pass_filenames: false
        always_run: true
        fail_fast: true
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: pytest-on-push
        name: Running all tests before push...
        entry: ./scripts/run_all_tests_and_coverage.sh
        language: script
        pass_filenames: false
        always_run: true
        fail_fast: true
        stages: [pre-push]
